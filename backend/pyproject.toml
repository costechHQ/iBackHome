[project]
name = "ibackhome-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]  # assert is fine in tests and type narrowing

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]  # the local alembic/ folder is not our package

[tool.ruff.lint.per-file-ignores]
"app/core/config.py" = ["S105"]  # local-development default secrets, overridden by .env

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["app.*.tests.*", "tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "app"]
filterwarnings = ["ignore::DeprecationWarning"]
