[project]
name = "ibackhome-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "celery>=5.4",
    "fastapi>=0.115,<1",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0,<2.2",
    "uvicorn[standard]>=0.30",
]

# Dependencies are managed with uv (see Docs/adr/0002-uv-dependencies.md).
# Core runtime (Christopher) goes in [project] dependencies; everyone else adds packages to
# their own group with:  uv add --group <your-name> <package>
# If uv.lock conflicts after a merge, don't hand-edit it: take either side and run `uv lock`.

[tool.uv]
default-groups = "all"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]  # assert is fine in tests and type narrowing

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]  # the local alembic/ folder is not our package

[tool.ruff.lint.per-file-ignores]
"app/core/config.py" = ["S105"]  # local-development default secrets, overridden by .env

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["app.*.tests.*", "tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "app"]
filterwarnings = ["ignore::DeprecationWarning"]

[dependency-groups]
abigail = [
    "boto3>=1.35",
    "cryptography>=43",
    "geoalchemy2>=0.15",
    "moto[s3]>=5",
]
christopher = [
    "geoalchemy2>=0.15",
    "phonenumbers>=9.0.41",
    "pyjwt>=2.9",
    "sentry-sdk[fastapi]>=2.14",
]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
gabriel = [
    "pypdf>=5.0",
    "respx>=0.21",
    "stripe>=10.0",
]
james = [
    "google-genai>=2.0,<3",
    "imagehash>=4.3",
    "markdown>=3.7",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "weasyprint>=62",
]
lilian = [
    "pyjwt[crypto]>=2.9",
]
