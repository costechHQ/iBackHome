name: backend-ci

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ibackhome
          POSTGRES_PASSWORD: ibackhome
          POSTGRES_DB: ibackhome
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ibackhome"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://ibackhome:ibackhome@localhost:5432/ibackhome
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy app
      - name: Migrations upgrade from empty, then downgrade one step and back
        run: alembic upgrade head && alembic downgrade -1 && alembic upgrade head
      - name: Tests
        run: pytest -q
