# Local development stack. Owner: Christopher.
# Start everything:  docker compose up --build
# API docs:          http://localhost:8000/docs
# Health check:      http://localhost:8000/healthz
# Object storage:    http://localhost:9000  (S3 API, SeaweedFS; keys are STORAGE_ACCESS_KEY / STORAGE_SECRET_KEY)

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://ibackhome:ibackhome@db:5432/ibackhome
    REDIS_URL: redis://redis:6379/0
    STORAGE_ENDPOINT: http://storage:9000
  volumes:
    - ./backend:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: celery -A app.workers.celery_app worker --loglevel=info

  beat:
    <<: *backend
    command: celery -A app.workers.celery_app beat --loglevel=info

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ibackhome
      POSTGRES_PASSWORD: ibackhome
      POSTGRES_DB: ibackhome
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibackhome"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage for evidence uploads. MinIO stopped publishing Docker images in 2025;
  # SeaweedFS speaks the same S3 API, so boto3 code works unchanged. Staging/production use R2 or B2.
  storage:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=9000 -volume.max=0
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-ibackhome}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-ibackhome-dev-secret}
    ports:
      - "9000:9000"
    volumes:
      - storage-data:/data

volumes:
  db-data:
  storage-data:
