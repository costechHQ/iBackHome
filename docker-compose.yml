# Local development stack. Owner: Christopher.
# Start everything:  docker compose up --build
# API docs:          http://localhost:8000/docs
# Health check:      http://localhost:8000/healthz
# Object storage:    http://localhost:9000  (S3 API, SeaweedFS; keys are STORAGE_ACCESS_KEY / STORAGE_SECRET_KEY)
# Web app:           http://localhost:3000  (production build; for hot reload run `bun run dev` in web/ instead)

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://ibackhome:ibackhome@db:5432/ibackhome
    REDIS_URL: redis://redis:6379/0
    STORAGE_ENDPOINT: http://storage:9000
    # uvicorn trusts X-Forwarded-For only from the web container (its auth proxy forwards the caller's IP),
    # so the per-IP OTP limit sees the browser, not the proxy. Calls to :8000 from the host are unaffected.
    FORWARDED_ALLOW_IPS: 172.31.251.10
  volumes:
    - ./backend:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: celery -A app.workers.celery_app worker --loglevel=info

  beat:
    <<: *backend
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule

  # The Next.js web app (ADR 0004). The browser talks only to it; its server calls the API inside Docker.
  web:
    build: ./web
    environment:
      API_INTERNAL_URL: http://api:8000
      IBH_ENVIRONMENT: local # the ops console badge
      IBH_MOCKS: all # mock adapters for missing endpoints (web/src/common/api/mocks); never in production
    ports:
      - "3000:3000"
    networks:
      default:
        ipv4_address: 172.31.251.10
    depends_on:
      - api

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ibackhome
      POSTGRES_PASSWORD: ibackhome
      POSTGRES_DB: ibackhome
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # TCP (-h 127.0.0.1), not the Unix socket: on first boot the image runs PostGIS init on a temporary
      # socket-only server, then restarts. A socket check passes during init and the api's migration fails.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ibackhome -d ibackhome"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage for evidence uploads. MinIO stopped publishing Docker images in 2025;
  # SeaweedFS speaks the same S3 API, so boto3 code works unchanged. Staging/production use R2 or B2.
  storage:
    image: chrislusf/seaweedfs:4.48
    # -ip gives a stable identity; without it a restart changes the container IP and the server never recovers.
    command: server -ip=storage -ip.bind=0.0.0.0 -dir=/data -s3 -s3.port=9000 -volume.max=0
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-ibackhome}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-ibackhome-dev-secret}
    ports:
      - "9000:9000"
    volumes:
      - storage-data:/data
    healthcheck:
      # Any HTTP answer (403 without credentials) means the S3 API is up. Takes ~15 s after a restart.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:9000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

# A fixed subnet so the web container has a fixed address for FORWARDED_ALLOW_IPS above.
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.251.0/24

volumes:
  db-data:
  storage-data:
