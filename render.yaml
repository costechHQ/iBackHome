# Render Blueprint for the BACKEND only (ADR 0003), FREE-TIER version. Owner: Christopher.
# Web and Flutter are not deployed yet. deploy/staging/ (VPS) stays until Render is verified.
#
# Everything here is on Render's free plans: one free web service, free Postgres, free Key Value.
# Render has NO free background workers, so the Celery worker and Celery beat run INSIDE the api
# container (one start command, below). That is fine for staging and demos, not for production.
#
# What the free plans mean (read before relying on this):
#   - The api sleeps after 15 minutes without traffic and takes about a minute to wake. While it
#     sleeps, the Celery worker and beat sleep too, so scheduled jobs (escrow sweep, reconcile,
#     reminders, report sends) and queued tasks (evidence checks, notifications) wait until the next
#     request. Ping https://<api>.onrender.com/healthz every 10 minutes from a free uptime monitor
#     (UptimeRobot or cron-job.org) to keep it awake. A free web service gets 750 hours a month,
#     enough for one service running all month.
#   - The free Postgres is deleted 30 days after it is created (a 14-day grace period follows) and
#     has no backups. Fine for staging. Only one free Postgres per Render account.
#   - The free Key Value (Redis) holds 25 MB and does not persist: a restart drops queued tasks.
#   - The api has 512 MB of memory and 0.1 CPU. Celery is limited to one process to fit.
#   - Photos cannot be stored on Render's free disk (there is none). Use a free S3-compatible bucket
#     (Backblaze B2 gives 10 GB free); see STORAGE_* below.
#   - Free services have no preDeployCommand, so migrations run at the start of the start command.
#     That is safe because there is exactly one instance. Never scale the api above 1 instance:
#     beat would then run every scheduled job twice.
#
# Create it: Render dashboard > New > Blueprint > pick this repo (branch main). Render reads this file.
# Secrets are NOT in this file. After the first sync, open Environment Groups > ibackhome-app and add
# the variables listed at the bottom (same names as .env.example).

services:
  - type: web
    name: ibackhome-api
    runtime: docker
    region: frankfurt
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass # deploy only after backend-ci passes on main
    # 1) migrate  2) Celery worker + beat in the background (-B, one process, PID-file schedule in /tmp)
    # 3) the API in the foreground on Render's $PORT (10000 by default). If uvicorn stops, the
    # container stops and Render restarts the lot.
    dockerCommand: >-
      sh -c "alembic upgrade head &&
      (celery -A app.workers.celery_app worker -B --concurrency=1 --loglevel=info
      --schedule /tmp/celerybeat-schedule &) &&
      exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000} --proxy-headers"
    envVars:
      - fromGroup: ibackhome-app
      - key: DATABASE_URL
        fromDatabase:
          name: ibackhome-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ibackhome-redis
          property: connectionString

  - type: keyvalue
    name: ibackhome-redis
    region: frankfurt
    plan: free
    maxmemoryPolicy: noeviction # Celery's queue must never be evicted
    ipAllowList: [] # private network only

databases:
  - name: ibackhome-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: [] # private network only; use the dashboard's External URL temporarily for psql

envVarGroups:
  - name: ibackhome-app
    envVars:
      - key: ENVIRONMENT
        value: staging # change to production for the live environment
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      # Render's proxy sets X-Forwarded-For and the services are not reachable except through it, so trust it.
      # (The VPS used Caddy's subnet; Render's proxy addresses are not fixed.)
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: JWT_SECRET
        generateValue: true # random, longer than the 32 characters the app requires

# Add to the ibackhome-app group in the dashboard (secrets and per-environment values):
#   CORS_ORIGINS            web origin(s); empty list of real origins is fine until the web phase
#   STORAGE_ENDPOINT, STORAGE_BUCKET, STORAGE_ACCESS_KEY, STORAGE_SECRET_KEY   a free S3-compatible bucket (Backblaze B2 or Cloudflare R2); /healthz fails without one
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, PAYSTACK_SECRET_KEY, ESCROW_WEBHOOK_SECRET   TEST keys on staging
#   FUNDING_SUCCESS_URL, FUNDING_CANCEL_URL, FX_NGN_PER_GBP, FX_NGN_PER_USD, FX_NGN_PER_EUR, FUNDING_FEE_BPS
#   LLM_API_KEY, LLM_MODEL
#   at least one login channel: EMAIL_SMTP_* + EMAIL_FROM, or TERMII_API_KEY + TERMII_SENDER_ID (else nobody can sign in)
#   SENTRY_DSN, SENTRY_TRACES_SAMPLE_RATE
#   optional: FCM_*, WHATSAPP_*, NOTIFY_*
# Stripe webhook URL after deploy: https://<ibackhome-api>.onrender.com/api/v1/webhooks/stripe
